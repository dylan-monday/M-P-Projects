<!--
  M+P Magic Link email — paper light, code-only.

  Paste the body content into:
  Supabase Dashboard → Authentication → Email Templates → Magic Link

  CRITICAL: this template intentionally does NOT include a clickable link.
  Email security scanners (Gmail, M365 Defender, gov mail systems) pre-fetch
  links to scan them, which hits Supabase's verify endpoint and consumes
  the OTP token before the user can use it. The 6-digit code displayed
  below is the same token but cannot be consumed by a scanner — there is
  no URL to fetch. Do not add {{ .ConfirmationURL }} back to this template.

  Supabase template variables used:
    {{ .Token }}             6-digit one-time code (the only auth vector)
    {{ .SiteURL }}           The configured Site URL (for safe display only)

  Subject (Supabase has a separate field):
    Your Monday + Partners sign-in code
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in to Monday + Partners</title>
</head>
<body style="margin:0; padding:0; background:#FAFAF7; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; color:#111111; -webkit-font-smoothing:antialiased;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#FAFAF7;">
    <tr>
      <td align="center" style="padding:40px 20px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:560px; margin:0 auto; background:#FAFAF7;">

          <tr>
            <td style="height:4px; background:#C9D92E; line-height:1px; font-size:1px;">&nbsp;</td>
          </tr>

          <tr>
            <td style="padding:0 0 24px;">
              <p style="margin:12px 0; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:#555555;">Monday + Partners · Client Portal</p>
              <h1 style="margin:0; font-size:26px; font-weight:500; line-height:1.25; color:#111111;">Your sign-in code</h1>
            </td>
          </tr>

          <tr>
            <td style="padding:0 0 24px; font-size:16px; line-height:1.6; color:#333333;">
              <p style="margin:0;">Enter this code on the sign-in page to access your portal. The code is valid for one hour and can be used once.</p>
            </td>
          </tr>

          <tr>
            <td style="padding:0 0 36px;">
              <div style="font-family:'SF Mono', Menlo, Consolas, 'Courier New', monospace; font-size:34px; letter-spacing:0.32em; color:#111111; background:#FFFFFF; border:1px solid #E5E2D8; padding:18px 24px; display:inline-block; font-weight:500;">{{ .Token }}</div>
            </td>
          </tr>

          <tr>
            <td style="border-top:1px solid #E5E2D8; padding-top:24px;">
              <p style="margin:0; font-size:13px; line-height:1.6; color:#888888;">Didn't request this? You can safely ignore this email.</p>
            </td>
          </tr>

          <tr>
            <td style="padding-top:32px;">
              <p style="margin:0 0 4px; font-size:10px; letter-spacing:0.25em; text-transform:uppercase; color:#555555;">Clarity · Conjuring · Currency</p>
              <p style="margin:6px 0 0; font-size:11px; color:#888888;">Monday + Partners · New Orleans</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
